[program:claude_subscription_bridge]
; The shared Claude bridge for pi-dev chats (written by setup_pi_subscriptions.py claude-shared in
; .external_worktrees/untitled-notes-voice/deploy/pi_subscriptions; rerun it to update).
command=python3 system/services/oom_priority/bin/oom_tag_service.py user /home/user/.local/share/pi-subscriptions/meridian/run.sh
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/claude_subscription_bridge-stdout.log
stderr_logfile=/var/log/supervisor/claude_subscription_bridge-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
